<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f4efe6" />
  <title>Opciones de diseño | J&G Soluciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:84px}
    body{margin:0;background:#f3f3f3;color:#1b1c1e;font-family:"DM Sans",Arial,sans-serif}
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    .site{--ink:#20211f;--accent:#bb7054;--paper:#f4efe6;--surface:#fffdfa;--muted:#6d716c;--line:#e5ddd1;--radius:18px;--display:Georgia,serif;min-height:100vh;color:var(--ink);background:var(--paper);font-family:"DM Sans",Arial,sans-serif}
    .site-header{height:82px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.04em}
    .brand img{width:48px;height:44px;object-fit:contain}
    .brand span{color:var(--accent)}
    .site-nav{display:flex;gap:27px;align-items:center;font-size:11px;font-weight:600}
    .site-nav a:not(.nav-cta){opacity:.74}
    .nav-cta,.action{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:13px 17px;background:var(--accent);color:#fff;border:1px solid var(--accent);font-size:11px;font-weight:700;transition:transform 180ms ease-out,background 180ms ease-out}
    .nav-cta:hover,.action:hover{transform:translateY(-2px)}
    .action.secondary{background:transparent;color:inherit;border-color:currentColor}
    .menu-toggle{display:none;background:none;border:0;color:inherit;font-size:20px}
    .hero{min-height:600px;padding:74px 8%;display:grid;grid-template-columns:1fr .93fr;gap:6%;align-items:center;overflow:hidden}
    .hero-copy{position:relative;z-index:1}
    .kicker{font-size:9px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:10px}
    .kicker:before{content:"";height:1px;width:23px;background:currentColor}
    .hero h1{font:600 clamp(43px,5.5vw,72px)/1.04 var(--display);letter-spacing:-.055em;margin:22px 0 18px;max-width:630px}
    .hero h1 em{font-weight:400;color:var(--accent)}
    .hero-copy>p{font-size:13px;line-height:1.85;color:var(--muted);max-width:465px;margin:0}
    .actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:26px}
    .hero-photo{position:relative;min-height:420px;height:clamp(420px,47vw,560px);border-radius:var(--radius);overflow:hidden;background:#ddd}
    .hero-photo>img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
    .hero-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#10111472,transparent 36%);pointer-events:none}
    .hero-photo-caption{position:absolute;z-index:1;bottom:22px;left:24px;color:#fff;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
    .trust-row{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px;font-size:10px;color:var(--muted)}
    .trust-row span:before{content:"✓";color:var(--accent);font-weight:700;margin-right:7px}
    .intro{padding:45px 8%;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:30px}
    .intro strong{font:500 25px/1.3 var(--display);letter-spacing:-.03em;max-width:610px}
    .intro small{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:700}
    .section{padding:84px 8%}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:31px}
    .section-head h2{font:600 clamp(32px,4vw,49px)/1.08 var(--display);letter-spacing:-.05em;margin:13px 0 0}
    .section-head p{max-width:330px;color:var(--muted);font-size:11px;line-height:1.8;margin:0}
    .services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .service-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:23px;min-height:184px}
    .service-card .number{color:var(--accent);font-size:9px;font-weight:700;letter-spacing:.12em}
    .service-card h3{font-size:15px;margin:18px 0 8px;letter-spacing:-.03em}
    .service-card p{color:var(--muted);font-size:10px;line-height:1.75;margin:0}
    .service-card a{display:inline-block;margin-top:17px;font-size:9px;font-weight:700;color:var(--accent)}
    .work-section{background:var(--ink);color:#fff}
    .work-section .section-head p{color:#c1c2c0}
    .work-section .kicker{color:#d8b270}
    .filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
    .filter-row button{background:transparent;border:1px solid #ffffff4b;color:#fff;padding:9px 13px;font-size:9px;border-radius:999px;cursor:pointer}
    .filter-row button[aria-pressed="true"]{background:#fff;color:#161716;border-color:#fff}
    .work-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .work-card{position:relative;display:block;overflow:hidden;min-height:200px;background:#343536}
    .work-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 300ms ease-out}
    .work-card:hover img{transform:scale(1.035)}
    .work-card:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#101114d9)}
    .work-copy{position:absolute;z-index:1;bottom:17px;left:17px;right:17px}
    .work-copy small{color:#e7c987;text-transform:uppercase;font-size:8px;letter-spacing:.13em}
    .work-copy b{display:block;margin-top:5px;font:500 14px var(--display)}
    .about{display:grid;grid-template-columns:.95fr 1fr;gap:9%;align-items:center}
    .about-photo{height:430px;position:relative}
    .about-photo img{width:100%;height:100%;object-fit:cover}
    .about-photo:after{content:"";position:absolute;inset:0;border:1px solid #fff9;pointer-events:none}
    .about-copy h2{font:600 clamp(35px,4.2vw,54px)/1.08 var(--display);letter-spacing:-.05em;margin:16px 0}
    .about-copy>p{font-size:12px;line-height:1.9;color:var(--muted);max-width:450px}
    .about-copy .action{margin-top:15px}
    .closing{padding:48px 8%;background:var(--accent);color:white;display:flex;justify-content:space-between;align-items:center;gap:24px}
    .closing h2{font:500 clamp(27px,3.5vw,40px)/1.15 var(--display);margin:0}
    .closing .action{border-color:#fff;color:#fff;background:transparent;white-space:nowrap}
    .site-footer{padding:27px 8%;background:#181918;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:10px}
    .site-footer small{color:#b7b9b6}
    .entry{animation:rise 260ms cubic-bezier(.16,1,.3,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .tecnico{--ink:#102a43;--accent:#13a3d2;--paper:#edf3f6;--surface:#fff;--muted:#607386;--line:#d5e0e7;--radius:5px;--display:"DM Sans",Arial,sans-serif}
    .tecnico .site-header{background:#102a43;color:#fff;border-color:#24435b}
    .tecnico .brand span{color:#42c4e8}
    .tecnico .hero{background:#102a43;color:#fff;min-height:640px}
    .tecnico .hero h1{font-weight:700;letter-spacing:-.065em}
    .tecnico .hero h1 em{font-style:normal;color:#42c4e8}
    .tecnico .hero-copy>p{color:#cad6df}
    .tecnico .hero-photo{border:1px solid #4aa9c980;border-radius:2px}
    .tecnico .hero-photo:after{background:linear-gradient(0deg,#071727a8,transparent 50%)}
    .tecnico .trust-row{color:#d0dce5}
    .tecnico .section-head h2{font-weight:700}
    .tecnico .service-card{border-radius:2px;border-top:3px solid var(--accent);box-shadow:0 8px 20px #102a430c}
    .tecnico .work-section{background:#0b1e30}
    .tecnico .work-card{border:1px solid #314c62}
    .tecnico .about-photo:after{border:6px solid #13a3d240}
    .tecnico .closing{background:#13a3d2;color:#062235}
    .tecnico .closing .action{color:#062235;border-color:#062235}
    .editorial{--ink:#25221f;--accent:#a67c3d;--paper:#f1eee7;--surface:#fbfaf6;--muted:#6f6a62;--line:#ded8cc;--radius:0;--display:"Playfair Display",Georgia,serif;font-family:"DM Sans",Arial,sans-serif}
    .editorial .site-header{height:94px;border:0;border-bottom:1px solid var(--line)}
    .editorial .site-nav{font-size:9px;letter-spacing:.12em;text-transform:uppercase}
    .editorial .nav-cta{background:transparent;color:var(--ink);border-color:var(--ink);text-transform:uppercase;letter-spacing:.08em}
    .editorial .hero{padding:0;display:block;min-height:690px;position:relative;background:#242424}
    .editorial .hero-photo{position:absolute;inset:0;height:100%;min-height:0;border-radius:0}
    .editorial .hero-photo:after{background:linear-gradient(90deg,#141311dc 0%,#1413119e 50%,#14131112 100%)}
    .editorial .hero-copy{position:absolute;top:50%;left:10%;transform:translateY(-50%);max-width:650px;color:#fff}
    .editorial .hero-copy.entry{animation:editorialFade 260ms ease-out both}
    @keyframes editorialFade{from{opacity:0}to{opacity:1}}
    .editorial .hero-copy>p{color:#e3dfd8}
    .editorial .hero h1{font-size:clamp(53px,7vw,91px);font-weight:500;line-height:.99;max-width:700px}
    .editorial .hero h1 em{color:#e3c88d}
    .editorial .hero-photo-caption{left:auto;right:7%;bottom:30px;letter-spacing:.18em}
    .editorial .trust-row{color:#e6e1d8}
    .editorial .intro{padding-top:60px;padding-bottom:60px}
    .editorial .intro strong{font-size:31px;max-width:680px}
    .editorial .section{padding-top:105px;padding-bottom:105px}
    .editorial .services-grid{grid-template-columns:repeat(2,1fr);gap:0}
    .editorial .service-card{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;padding:26px 12px;min-height:165px}
    .editorial .service-card h3{font:500 22px var(--display)}
    .editorial .work-grid{grid-template-columns:repeat(3,1fr);gap:7px}
    .editorial .work-card{min-height:250px}
    .editorial .work-card:nth-child(1){grid-row:span 2}
    .editorial .about{gap:11%}
    .editorial .about-photo{height:520px}
    .editorial .about-photo:after{inset:18px -18px -18px 18px;border:1px solid var(--accent)}
    .editorial .about-copy h2{font-size:clamp(42px,5.1vw,67px)}
    .editorial .closing{background:#25221f}
    .editorial .site-footer{background:#25221f}
    @media(max-width:760px){
      .site-header{height:70px;padding:0 5%}
      .brand{font-size:15px}.brand img{width:40px;height:40px}
      .menu-toggle{display:block}
      .site-nav{display:none;position:absolute;top:69px;left:0;right:0;padding:16px 5% 20px;background:var(--surface);color:var(--ink);flex-direction:column;align-items:stretch;gap:15px;border-bottom:1px solid var(--line)}
      .tecnico .site-nav{background:#102a43;color:#fff}
      .site-nav.open{display:flex}
      .site-nav .nav-cta{justify-content:center}
      .hero{padding:52px 6%;grid-template-columns:1fr;gap:25px}
      .hero h1{font-size:clamp(42px,11vw,62px)}
      .hero-photo{height:340px;min-height:340px}
      .trust-row{margin-top:21px}
      .intro{padding:34px 6%;align-items:flex-start;flex-direction:column;gap:12px}
      .intro strong{font-size:23px}
      .section{padding:64px 6%}
      .section-head{display:block}
      .section-head p{margin-top:14px}
      .services-grid{grid-template-columns:1fr 1fr}
      .service-card{padding:17px;min-height:175px}
      .work-grid{grid-template-columns:1fr 1fr}
      .work-card{min-height:165px}
      .about{grid-template-columns:1fr;gap:32px}
      .about-photo{height:360px}
      .closing{padding:36px 6%;align-items:flex-start;flex-direction:column}
      .site-footer{padding:24px 6%;align-items:flex-start;flex-direction:column}
      .editorial .hero{min-height:640px}
      .editorial .hero-copy{left:7%;right:7%;top:48%;transform:translateY(-50%)}
      .editorial .hero h1{font-size:clamp(48px,12vw,70px)}
      .editorial .services-grid{grid-template-columns:1fr 1fr}
      .editorial .section{padding-top:72px;padding-bottom:72px}
      .editorial .about-photo{height:360px}
      .editorial .work-card{min-height:175px}
    }
    @media(max-width:430px){
      .services-grid,.editorial .services-grid{grid-template-columns:1fr}
      .work-card{min-height:150px}
      .actions .action{width:100%}
      .editorial .work-grid{grid-template-columns:1fr 1fr}
      .editorial .work-card:nth-child(1){grid-row:span 1}
    }
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.entry,.work-card img{animation:none;transition:none}}
    .proto-picker {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483647;
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 4px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.82);
      -webkit-backdrop-filter: blur(12px) saturate(1.4);
      backdrop-filter: blur(12px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 8px 24px rgba(0, 0, 0, 0.24),
        0 2px 6px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    .proto-picker-highlight {
      position: absolute;
      top: 4px;
      left: 0;
      height: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      will-change: transform;
    }
    .proto-picker[data-ready] .proto-picker-highlight {
      transition:
        transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
        width 250ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-reduced-motion: reduce) {
      .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
    }
    .proto-picker-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      font: inherit;
      cursor: pointer;
      transition: color 150ms ease-out;
    }
    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker-divider {
      width: 1px;
      height: 16px;
      margin: 0 4px;
      background: rgba(255, 255, 255, 0.12);
    }
    .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  </style>
</head>
<body>
  <main id="stage"></main>
  <nav class="proto-picker" aria-label="Prototype variants">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Casa cálida</button>
    <button class="proto-picker-item">Técnico</button>
    <button class="proto-picker-item">Editorial</button>
    <span class="proto-picker-divider" aria-hidden="true"></span>
    <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
  </nav>
  <script>
    const WA = 'https://wa.me/18299753029?text=Hola%2C%20quiero%20informaci%C3%B3n%20sobre%20sus%20servicios';
    const services = [
      ['01','Decoración','Ideas, materiales y detalles para transformar cada ambiente.','Decoración'],
      ['02','Electricidad','Instalaciones y mejoras eléctricas para tu hogar.','Electricidad'],
      ['03','Plomería','Soluciones para baños, cocinas, grifería y tuberías.','Plomería'],
      ['04','Remodelaciones','Renovamos tus espacios con atención en cada etapa.','Remodelaciones'],
      ['05','Mantenimiento','Reparaciones y cuidado de equipos y espacios.','Mantenimiento'],
      ['06','Otros servicios','Cuéntanos qué necesitas resolver en casa.','Otros servicios']
    ];
    const works = [
      ['Remodelación interior','Decoración','/images/portfolio/jv-photo-034.webp'],
      ['Baño renovado','Plomería','/images/portfolio/jv-photo-066.webp'],
      ['Luminaria decorativa','Electricidad','/images/portfolio/jv-photo-085.webp'],
      ['Paneles y acabados','Remodelaciones','/images/portfolio/jv-photo-018.webp'],
      ['Área de piscina','Mantenimiento','/images/portfolio/jv-photo-099.webp'],
      ['Instalación de tablero','Electricidad','/images/portfolio/jv-photo-143.webp']
    ];
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;
    function renderSite(theme) {
      const casa = theme === 'casa';
      const tecnico = theme === 'tecnico';
      const editorial = theme === 'editorial';
      const headline = casa ? 'Tu hogar merece sentirse <em>extraordinario.</em>' : tecnico ? 'Soluciones precisas para cada <em>espacio.</em>' : 'Un hogar que refleja <em>lo que importa.</em>';
      const heroText = casa ? 'Ideas que toman forma. Soluciones hechas con cuidado. Estamos aquí para transformar tus espacios y hacer tu día a día más fácil.' : tecnico ? 'Instalaciones, mantenimiento y remodelaciones para que cada espacio funcione como debe.' : 'Cuidamos los detalles que convierten una casa en el lugar al que siempre quieres volver.';
      const photo = editorial ? '/images/portfolio/jv-photo-066.webp' : '/images/portfolio/jv-photo-034.webp';
      const serviceCards = services.map(([n,title,copy,type]) => '<article class="service-card"><span class="number">'+n+' / '+type.toUpperCase()+'</span><h3>'+title+'</h3><p>'+copy+'</p><a href="'+WA+'" target="_blank" rel="noreferrer">Solicitar servicio ↗</a></article>').join('');
      const workCards = works.map(([title,type,image]) => '<a class="work-card" data-service="'+type+'" href="'+image+'" target="_blank" rel="noreferrer" aria-label="Ampliar '+title+'"><img loading="lazy" src="'+image+'" alt="'+title+'"><span class="work-copy"><small>'+type+'</small><b>'+title+'</b></span></a>').join('');
      return '<div class="site '+theme+'">'+
        '<header class="site-header"><a class="brand" href="#inicio" aria-label="J&G Soluciones, inicio"><img src="/logo-transparent.png" alt=""><strong>J&G <span>Soluciones</span></strong></a><button class="menu-toggle" data-menu-toggle aria-label="Abrir menú">☰</button><nav class="site-nav"><a href="#servicios">Servicios</a><a href="#nosotros">Nosotros</a><a href="#proyectos">Proyectos</a><a href="#contacto">Contacto</a><a class="nav-cta" href="'+WA+'" target="_blank" rel="noreferrer">Solicitar cotización ↗</a></nav></header>'+
        '<section class="hero" id="inicio"><div class="hero-copy entry"><span class="kicker">J&G SOLUCIONES · SANTO DOMINGO</span><h1>'+headline+'</h1><p>'+heroText+'</p><div class="actions"><a class="action" href="#servicios">Explorar servicios <span>→</span></a><a class="action secondary" href="'+WA+'" target="_blank" rel="noreferrer">Cotizar por WhatsApp ↗</a></div><div class="trust-row"><span>Atención cercana</span><span>Soluciones para tu hogar</span></div></div><div class="hero-photo entry"><img src="'+photo+'" alt="'+(editorial?'Baño renovado con acabados claros':'Interior remodelado con iluminación y acabados en madera')+'"><span class="hero-photo-caption">Trabajo real · J&G Soluciones</span></div></section>'+
        '<div class="intro"><small>UNA CASA, MUCHAS POSIBILIDADES</small><strong>Transformamos tus espacios.<br>Solucionamos tus necesidades.</strong></div>'+
        '<section class="section" id="servicios"><div class="section-head"><div><span class="kicker">LO QUE HACEMOS</span><h2>Soluciones para cada rincón.</h2></div><p>Un solo equipo para las ideas y tareas que hacen de tu casa un espacio mejor.</p></div><div class="services-grid">'+serviceCards+'</div></section>'+
        '<section class="section work-section" id="proyectos"><div class="section-head"><div><span class="kicker">TRABAJOS REALES</span><h2>Hechos para vivirlos.</h2></div><p>Algunas imágenes de decoración, instalaciones, baños, remodelaciones y mantenimiento.</p></div><div class="filter-row" role="group" aria-label="Filtrar trabajos"><button data-filter="Todos" aria-pressed="true">Todos</button><button data-filter="Decoración" aria-pressed="false">Decoración</button><button data-filter="Electricidad" aria-pressed="false">Electricidad</button><button data-filter="Plomería" aria-pressed="false">Plomería</button><button data-filter="Remodelaciones" aria-pressed="false">Remodelaciones</button><button data-filter="Mantenimiento" aria-pressed="false">Mantenimiento</button></div><div class="work-grid">'+workCards+'</div></section>'+
        '<section class="section about" id="nosotros"><div class="about-photo"><img loading="lazy" src="/images/portfolio/jv-photo-067.webp" alt="Baño remodelado con ducha y lavamanos"></div><div class="about-copy"><span class="kicker">CONOCE J&G SOLUCIONES</span><h2>Hacemos espacio para <em>lo que importa.</em></h2><p>Somos un emprendimiento dedicado a ofrecer soluciones para el hogar en mantenimiento, decoración, instalaciones y remodelaciones.</p><p>Escuchamos lo que necesitas y cuidamos el proceso para que cada espacio se sienta más tuyo.</p><a class="action" href="#contacto">Hablemos de tu proyecto →</a></div></section>'+
        '<section class="closing" id="contacto"><h2>¿Necesitas una solución para tu hogar?</h2><a class="action" href="'+WA+'" target="_blank" rel="noreferrer">Escríbenos por WhatsApp ↗</a></section>'+
        '<footer class="site-footer"><strong>J&G Soluciones</strong><small>Santo Domingo, República Dominicana · 829-975-3029</small><small>Transformamos tus espacios, solucionamos tus necesidades.</small></footer>'+
        '</div>';
    }
    const variants = [
      () => renderSite('casa'),
      () => renderSite('tecnico'),
      () => renderSite('editorial')
    ];
    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = 'translateX(' + el.offsetLeft + 'px)';
    }
    function mount(i) {
      stage.innerHTML = '';
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); window.scrollTo(0,0); });
    }
    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el,j) => {
        el.toggleAttribute('data-active',j===i);
        if (j===i) el.setAttribute('aria-current','true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v',i+1);
      history.replaceState(null,'',url);
      document.title = ['Casa cálida','Técnico contemporáneo','Editorial premium'][i] + ' | J&G Soluciones';
      mount(i);
    }
    items.forEach((el,i) => el.addEventListener('click',() => setActive(i)));
    replay?.addEventListener('click',() => mount(current));
    window.addEventListener('resize',moveHighlight);
    stage.addEventListener('click',e => {
      const filter=e.target.closest('[data-filter]');
      if(filter){
        const selected=filter.dataset.filter;
        stage.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===filter)));
        stage.querySelectorAll('.work-card').forEach(card=>card.hidden=selected!=='Todos'&&card.dataset.service!==selected);
      }
      const menu=e.target.closest('[data-menu-toggle]');
      if(menu){
        const nav=stage.querySelector('.site-nav');const opened=nav.classList.toggle('open');
        menu.setAttribute('aria-expanded',String(opened));menu.setAttribute('aria-label',opened?'Cerrar menú':'Abrir menú');
      }
    });
    document.addEventListener('keydown',e => {
      if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
      if(e.metaKey||e.ctrlKey||e.altKey)return;
      const num=parseInt(e.key,10);
      if(num>=1&&num<=variants.length)setActive(num-1);
      else if(e.key==='ArrowRight')setActive((current+1)%variants.length);
      else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);
      else if(e.key==='r'||e.key==='R')mount(current);
    });
    history.scrollRestoration = 'manual';
    window.scrollTo(0,0);
    setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
    window.addEventListener('load',()=>window.scrollTo(0,0),{once:true});
    requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
